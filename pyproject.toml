[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-stock-research-bot"
version = "0.4.0"
description = "Natural-language Discord stock research bot: DM it in English, agent runs tools, research lands"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "discord.py>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
discord-stock-research-bot = "discord_stock_research_bot.bot:main"

[project.urls]
Homepage = "https://github.com/SamsonCyber/discord-stock-research-bot"
Issues = "https://github.com/SamsonCyber/discord-stock-research-bot/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
