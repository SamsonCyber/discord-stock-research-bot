[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research-agent"
version = "0.4.3"
description = "Natural-language equity research agent: chat in English, agent runs tools, structured research lands (Discord DM adapter included)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "discord.py>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "PyYAML>=6.0"]

[project.scripts]
equity-research-agent = "equity_research_agent.bot:main"

[project.urls]
Homepage = "https://github.com/SamsonCyber/equity-research-agent"
Issues = "https://github.com/SamsonCyber/equity-research-agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
