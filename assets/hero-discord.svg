        **AAPL · research**<br/>`as_of offline-demo` · Apple · Technology · paper research only<br/>&nbsp;<br/>**Read** · INFERRED<br/>Apple (AAPL) is range-bound in this offline model. No edge until a clean break with volume. Size small or wait; fake breaks are the default.<br/>&nbsp;<br/>**1 · Tape** · VERIFIED (demo OHLCV)<br/>Last **$200.99** (-1.75%) · heavy volume (~1.8x avg)<br/>&nbsp;<br/>**2 · Lean** · INFERRED<br/>**neutral / range (INFERRED)** · conviction **med**<br/>&nbsp;<br/>**3 · Catalysts** · PROBABLE<br/>• Range break with expanding volume<br/>• Catalyst calendar (earnings / product / event)<br/>• Technology leadership change that pulls the name<br/>&nbsp;<br/>**4 · Risks** · PROBABLE<br/>• Whipsaw inside the range<br/>• Low-liquidity fake break<br/>• Macro headline risk that rewrites the tape<br/>&nbsp;<br/>**Invalidation**<br/>Two closes outside $194.96-$207.02 (demo band)<br/>&nbsp;<br/>_Demo research data only. Offline / deterministic. Not live market data. Not financial advice._<br/>&nbsp;<br/>_tools used: research_
