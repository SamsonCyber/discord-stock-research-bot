<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Discord stock research agent flow</title>
  <desc id="desc">Natural language DM to allowlist gate to research agent to tools to structured reply</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0d1528"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#121a30"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#bg)"/>
  <circle cx="80" cy="60" r="90" fill="#5865F2" opacity="0.08"/>
  <circle cx="900" cy="360" r="120" fill="#22d3ee" opacity="0.07"/>

  <!-- header -->
  <text x="40" y="42" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">
    Discord Stock Research Bot
  </text>
  <text x="40" y="66" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    Natural language in  ·  tools run  ·  research out
  </text>
  <rect x="700" y="28" width="220" height="32" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="810" y="49" text-anchor="middle" fill="#67e8f9" font-family="Consolas, monospace" font-size="12">
    offline-demo ready
  </text>

  <!-- flow boxes -->
  <g filter="url(#glow)">
    <rect x="40" y="110" width="160" height="100" rx="14" fill="url(#card)" stroke="#5865F2" stroke-width="1.5"/>
    <text x="120" y="148" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">YOU</text>
    <text x="120" y="172" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Discord DM</text>
    <text x="120" y="192" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">"research AAPL"</text>
  </g>

  <g>
    <rect x="240" y="110" width="160" height="100" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="320" y="148" text-anchor="middle" fill="#bae6fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">GATE</text>
    <text x="320" y="172" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Allowlist</text>
    <text x="320" y="192" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">DM-only · fail-closed</text>
  </g>

  <g>
    <rect x="440" y="110" width="160" height="100" rx="14" fill="url(#card)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="520" y="148" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">AGENT</text>
    <text x="520" y="172" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Intent → tools</text>
    <text x="520" y="192" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">NL classify · run_turn</text>
  </g>

  <g>
    <rect x="640" y="110" width="280" height="100" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="780" y="145" text-anchor="middle" fill="#ddd6fe" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">TOOLS</text>
    <text x="720" y="175" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="13">research</text>
    <text x="780" y="175" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="13">levels</text>
    <text x="840" y="175" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="13">risk</text>
    <text x="780" y="198" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">+ list_tools · deterministic offline engine</text>
  </g>

  <!-- arrows -->
  <line x1="200" y1="160" x2="236" y2="160" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="160" x2="436" y2="160" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="160" x2="636" y2="160" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- output card -->
  <rect x="40" y="250" width="880" height="140" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="250" width="8" height="140" rx="4" fill="url(#accent)"/>
  <text x="70" y="285" fill="#67e8f9" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">RESEARCH REPLY</text>
  <text x="70" y="315" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">**AAPL** research brief · Bias: bullish · Conviction: 4/5</text>
  <text x="70" y="340" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Thesis · Catalysts · Risks · Invalidation</text>
  <text x="70" y="365" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12">_tools used: research_   ·   same path in Discord DM or offline CLI</text>
</svg>
